name: Export Agent Binary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify image cache identity regression on Linux
        run: cargo test --manifest-path packages/agent-server-rust/Cargo.toml derives_a_download_target_from_any_exact_image_variant

      - name: Verify timed-out image helper exits on Linux
        run: cargo test --manifest-path packages/agent-server-rust/Cargo.toml timed_out_command_does_not_leave_a_child_running

      - name: Verify exact group-video download identity on Linux
        run: |
          cargo test --manifest-path packages/agent-server-rust/Cargo.toml video_download_target_requires_a_verified_hash
          cargo test --manifest-path packages/agent-server-rust/Cargo.toml video_operation_only_accepts_group_message_identity

      - name: Prepare Docker context
        run: |
          rm -rf docker/agent-server-rust
          mkdir -p docker/agent-server-rust
          cp packages/agent-server-rust/Cargo.toml docker/agent-server-rust/
          cp packages/agent-server-rust/Cargo.lock docker/agent-server-rust/
          cp -r packages/agent-server-rust/src docker/agent-server-rust/
          cp -r packages/agent-server-rust/migrations docker/agent-server-rust/

      - name: Build amd64 agent binary
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --target builder \
            --build-arg BUILD_MODE=release \
            --output type=local,dest=/tmp/agent-output \
            docker

      - uses: actions/upload-artifact@v4
        with:
          name: agent-server-amd64
          path: /tmp/agent-output/output/agent-server
          if-no-files-found: error
          retention-days: 1
